name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
        with:
          test-bot: true

      # setup-homebrew already taps this repository, so it only needs to be
      # trusted: Homebrew refuses to read a third-party tap otherwise.
      # `brew trust` is recent, so an older runner must not fail here.
      - name: Trust the tap
        run: brew trust "$GITHUB_REPOSITORY_OWNER/tap" || true

      - name: Check the tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Audit the casks against their live downloads
        run: |
          brew audit --cask --online --strict "$GITHUB_REPOSITORY_OWNER/tap/mdnotch"
          brew audit --cask --online --strict "$GITHUB_REPOSITORY_OWNER/tap/mac-widgets"
